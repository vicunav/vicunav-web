name: Tarea atómica
description: Define una tarea con alcance y criterios de aceptación verificables.
labels: []
assignees: []
body:
  - type: textarea
    id: por-que
    attributes:
      label: Por qué
      description: Explica el problema, la necesidad o el contexto de la tarea.
      placeholder: Describe por qué es necesario realizar esta tarea.
    validations:
      required: false

  - type: textarea
    id: hacer
    attributes:
      label: Hacer
      description: Describe el trabajo concreto que debe realizarse.
      placeholder: Enumera los cambios incluidos en el alcance de la tarea.
    validations:
      required: true

  - type: textarea
    id: criterios-aceptacion
    attributes:
      label: Criterios de aceptación
      description: Escribe criterios verificables usando el formato de checklist de Markdown.
      placeholder: |
        - [ ] criterio uno
        - [ ] criterio dos
    validations:
      required: true

  - type: dropdown
    id: impacto-visual
    attributes:
      label: Impacto visual
      description: Clasifica el cambio según el estándar de fidelidad visual.
      options:
        - ninguno - no cambia ninguna superficie renderizada
        - cambio-visual - cambia una interfaz sin contrato de paridad externa
        - paridad-1-1 - debe reproducir un diseño aprobado
    validations:
      required: true

  - type: textarea
    id: evidencia-visual
    attributes:
      label: Contrato y evidencia visual
      description: Para ninguno, justifica la clasificación. Para los demás, identifica baseline, viewports, estados y evidencia esperada.
      placeholder: |
        Clasificación: ninguno | cambio-visual | paridad-1-1
        Fuente o baseline:
        Viewports y estados:
        Evidencia y diferencias aprobadas:
    validations:
      required: true
