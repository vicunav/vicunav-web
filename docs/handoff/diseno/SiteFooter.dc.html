<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/colors.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/typography.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/radii.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/styles.css">
  <script src="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/_ds_bundle.js"></script>
  <style>body{margin:0}</style>
</helmet>
<footer style="position:relative;background:var(--color-dark);padding:{{ padTop }}px {{ padH }}px 32px;overflow:hidden;">
  <div style="position:absolute;right:-6%;top:-40%;width:38%;aspect-ratio:1;border-radius:999px;border:2px solid color-mix(in oklch, #E8873A 34%, #2B2825);pointer-events:none;"></div>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:{{ gap }}px;">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px;">
      <div style="display:flex;flex-direction:column;gap:14px;max-width:380px;">
        <span style="display:flex;align-items:flex-end;gap:8px;font-family:var(--font-family-base);font-weight:800;font-size:{{ wordmark }}px;letter-spacing:-0.03em;line-height:1;color:var(--color-light);">Vicunav<span style="width:9px;height:9px;border-radius:999px;background:var(--color-accent);display:block;margin-bottom:6px;"></span></span>
        <p style="margin:0;font-family:var(--font-family-base);font-size:16px;line-height:1.6;color:var(--color-secondary);">Sitios web y herramientas para profesionales independientes y negocios de servicios.</p>
      </div>
      <nav style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-family:var(--font-family-base);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px;">Sitio</span>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
          <button onClick="{{ l.onClick }}" style="text-align:left;background:none;border:none;min-height:44px;display:flex;align-items:center;padding:0;cursor:pointer;font-family:var(--font-family-base);font-size:16px;font-weight:500;color:var(--color-light);transition:color .15s ease;" style-hover="color:var(--color-accent)" style-focus="outline:2px solid var(--color-accent);outline-offset:2px;border-radius:4px;">{{ l.label }}</button>
        </sc-for>
      </nav>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <span style="font-family:var(--font-family-base);font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent);margin-bottom:8px;">Contacto</span>
        <a href="mailto:hello@vicunav.com" style="min-height:44px;display:flex;align-items:center;font-family:var(--font-family-base);font-size:16px;color:var(--color-light);text-decoration:none;transition:color .15s ease;" style-hover="color:var(--color-accent)" style-focus="outline:2px solid var(--color-accent);outline-offset:2px;">hello@vicunav.com</a>
        <a href="{{ whatsappHref }}" target="_blank" rel="noopener" style="min-height:44px;display:flex;align-items:center;font-family:var(--font-family-base);font-size:16px;color:var(--color-light);text-decoration:none;transition:color .15s ease;" style-hover="color:var(--color-accent)" style-focus="outline:2px solid var(--color-accent);outline-offset:2px;">WhatsApp</a>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:24px;border-top:1px solid color-mix(in oklch, #B7AE9F 24%, #2B2825);font-family:var(--font-family-base);font-size:14px;color:var(--color-secondary);">
      <span>© 2026 Vicunav. Todos los derechos reservados.</span>
      <span>Respuesta en 1 a 2 días hábiles.</span>
    </div>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:320},&quot;padH&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;min&quot;:16,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;},&quot;whatsappHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wa.me/10000000000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const nav = (key) => { if (this.props.onNavigate) this.props.onNavigate(key); };
    const defs = [['home', 'Inicio'], ['servicios', 'Servicios'], ['portafolio', 'Portafolio'], ['nosotros', 'Nosotros'], ['contacto', 'Contacto']];
    const pad = this.props.padH ?? 64;
    return {
      padH: pad,
      padTop: pad,
      gap: pad >= 64 ? 56 : 40,
      wordmark: pad >= 64 ? 40 : 30,
      whatsappHref: this.props.whatsappHref || 'https://wa.me/10000000000',
      links: defs.map(([key, label]) => ({ key, label, onClick: () => nav(key) }))
    };
  }
}
</script>
</body>
</html>
