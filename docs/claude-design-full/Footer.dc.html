<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/colors.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/typography.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/radii.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/styles.css">
  <script src="_ds/vicunav-tech-design-system-8a748154-b18c-4805-8ad1-18b641a17f56/_ds_bundle.js"></script>
  <style>body{margin:0}:root{--text-muted:color-mix(in oklch, var(--color-dark) 82%, var(--color-secondary))}</style>
</helmet>
<footer style="background:var(--color-light-2);padding:48px {{ padH }}px 32px;display:flex;flex-direction:column;gap:32px;border-top:1px solid var(--border-default);">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px;">
    <div style="display:flex;flex-direction:column;gap:8px;max-width:320px;">
      <span style="font-family:var(--font-family-base);font-weight:700;font-size:18px;color:var(--color-dark);">Vicunav</span>
      <p style="margin:0;font-family:var(--font-family-base);font-size:14px;line-height:1.6;color:var(--text-muted);">Tecnología a la medida para negocios de servicios.</p>
    </div>
    <nav style="display:flex;gap:24px;flex-wrap:wrap;">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <button onClick="{{ l.onClick }}" style="background:none;border:none;min-height:44px;display:flex;align-items:center;padding:0;cursor:pointer;font-family:var(--font-family-base);font-size:14px;font-weight:500;color:var(--color-dark);" style-hover="color:var(--color-accent)" style-focus="outline:2px solid var(--color-accent);outline-offset:2px;border-radius:4px;">{{ l.label }}</button>
      </sc-for>
    </nav>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span style="font-family:var(--font-family-base);font-size:13px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);">Contacto</span>
      <a href="mailto:hola@vicunav.com" style="min-height:44px;display:flex;align-items:center;font-family:var(--font-family-base);font-size:14px;color:var(--color-dark);text-decoration:none;" style-hover="color:var(--color-accent)" style-focus="outline:2px solid var(--color-accent);outline-offset:2px;">hola@vicunav.com</a>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:24px;border-top:1px solid var(--border-default);font-family:var(--font-family-base);font-size:13px;color:var(--text-muted);">
    <span>© 2026 Vicunav. Todos los derechos reservados.</span>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:220},&quot;padH&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;min&quot;:16,&quot;max&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const nav = (key) => { if (this.props.onNavigate) this.props.onNavigate(key); };
    const defs = [['home', 'Inicio'], ['servicios', 'Servicios'], ['portafolio', 'Portafolio'], ['contacto', 'Contacto']];
    return {
      padH: this.props.padH ?? 64,
      links: defs.map(([key, label]) => ({ key, label, onClick: () => nav(key) }))
    };
  }
}
</script>
</body>
</html>
